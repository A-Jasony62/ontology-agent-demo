services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  mcp:
    build: .
    ports:
      - "9000:9000"
    # 容器内须绑定 0.0.0.0（默认 127.0.0.1 仅容器内可达，端口映射会拒连）
    command: python mcp/mcp_server.py --domain agent_task --host 0.0.0.0 --port 9000
