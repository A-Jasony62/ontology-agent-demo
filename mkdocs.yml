site_name: 本体上手指南
site_description: 本体 × 智能体协作 —— 面向零基础读者的 9 篇入门系列（配套 ontology-agent-demo 仓库）
site_author: yangyue
repo_url: https://github.com/jasony62/ontology-agent-demo
edit_uri: blob/main/docs/guide/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

docs_dir: docs

nav:
  - 指南首页: guide/README.md
  - 概念认知:
      - 00 为什么需要本体: guide/00-为什么需要本体.md
      - 01 本体入门: guide/01-本体入门.md
      - 02 解剖示例本体: guide/02-解剖示例本体.md
  - 推理与图谱:
      - 03 本体推理原理: guide/03-本体推理原理.md
      - 04 本体与知识图谱: guide/04-本体与知识图谱.md
  - 服务搭建:
      - 05 搭建本体推理服务: guide/05-搭建本体推理服务.md
      - 06 MCP 接入智能体: guide/06-MCP接入智能体.md
  - 应用与扩展:
      - 07 智能体协作实战: guide/07-智能体协作实战.md
      - 08 扩展新领域: guide/08-扩展新领域.md
